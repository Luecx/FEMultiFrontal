name: Blocked LDLT
on:
  push:
    branches: [main, perf/ldlt-blocked-multifrontal]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run regression tests (single threaded)
        run: |
          make -j2 all check CXXFLAGS="-O3 -march=native -DNDEBUG -std=c++20 -Wall -Wextra -Wpedantic"
      - name: Test scalar and blocked solver entry points
        run: |
          ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 1
          ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 32
          ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 32 --ldlt-supernode-size 1
          ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 32 --ldlt-supernode-size 64
          ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 32 --ldlt-pivot-major-cache-refresh
          ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 32 --ldlt-signed-batch-panels --ldlt-signed-batch-width 8
          ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 32 --ldlt-pivot-major-cache-refresh --ldlt-simd-cache-apply
          ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 32 --ldlt-pivot-major-cache-refresh --ldlt-simd-cache-apply --ldlt-segmented-extend-add
          ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 32 --ldlt-no-indexed-schur
          ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 32 --ldlt-legacy-pivot-order --ldlt-no-tiled-schur --ldlt-no-relaxed-supernodes
      - name: Smoke-test reproducible LDLT A/B benchmark
        run: |
          python3 -m py_compile benchmarks/compare_ldlt_fastpath.py
          python3 benchmarks/compare_ldlt_fastpath.py tests/symmetric.mtx --binary build/native/mfsolve --threads 1 --ordering natural --warmups 0 --rounds 1
          python3 benchmarks/compare_ldlt_fastpath.py tests/symmetric.mtx --binary build/native/mfsolve --threads 1 --ordering natural --warmups 0 --rounds 1 --ablations
          python3 benchmarks/compare_ldlt_fastpath.py tests/symmetric.mtx --binary build/native/mfsolve --threads 1 --ordering natural --warmups 0 --rounds 1 --indexed-ablation
          python3 benchmarks/compare_ldlt_fastpath.py tests/symmetric.mtx --binary build/native/mfsolve --threads 1 --ordering natural --warmups 0 --rounds 1 --pivot-major-cache-ablation
          python3 benchmarks/compare_ldlt_fastpath.py tests/symmetric.mtx --binary build/native/mfsolve --threads 1 --ordering natural --warmups 0 --rounds 1 --simd-cache-apply-ablation
          python3 benchmarks/compare_ldlt_fastpath.py tests/symmetric.mtx --binary build/native/mfsolve --threads 1 --ordering natural --warmups 0 --rounds 1 --segmented-extend-add-ablation
          python3 benchmarks/compare_ldlt_fastpath.py tests/symmetric.mtx --binary build/native/mfsolve --threads 1 --ordering natural --warmups 0 --rounds 1 --signed-batch-ablation
          python3 benchmarks/compare_ldlt_fastpath.py tests/symmetric.mtx --binary build/native/mfsolve --threads 1 --ordering natural --warmups 0 --rounds 1 --signed-batch-skip-diagonal-ablation --signed-batch-width 31
          python3 benchmarks/compare_ldlt_fastpath.py tests/symmetric.mtx --binary build/native/mfsolve --threads 1 --ordering natural --warmups 0 --rounds 1 --signed-batch-simd-rectangle-ablation --signed-batch-width 31
          python3 benchmarks/compare_ldlt_fastpath.py tests/symmetric.mtx --binary build/native/mfsolve --threads 1 --ordering natural --warmups 0 --rounds 1 --signed-batch-register-blocking-ablation --signed-batch-width 31
          python3 benchmarks/compare_ldlt_fastpath.py tests/symmetric.mtx --binary build/native/mfsolve --threads 1 --ordering natural --warmups 0 --rounds 1 --signed-batch-simd-columns-ablation --signed-batch-width 31
          python3 benchmarks/compare_ldlt_fastpath.py tests/symmetric.mtx --binary build/native/mfsolve --threads 1 --ordering natural --warmups 0 --rounds 1 --contribution-copy-ablation
          python3 benchmarks/compare_ldlt_fastpath.py tests/symmetric.mtx --binary build/native/mfsolve --threads 1 --ordering natural --warmups 0 --rounds 1 --front-prepare-ablation
          python3 -m py_compile benchmarks/sweep_ldlt_panel_supernode.py
          python3 benchmarks/sweep_ldlt_panel_supernode.py tests/symmetric.mtx --binary build/native/mfsolve --ordering natural --pairs 4:4,4:8,8:4,8:8 --warmups 0 --rounds 1
      - name: Verify detailed LDLT profiling output
        run: |
          FEMF_LDLT_PROFILE=1 ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 32 > /tmp/ldlt-profile.txt 2>&1
          grep -q 'front_setup_s=' /tmp/ldlt-profile.txt
          grep -q 'cache_refresh_s=' /tmp/ldlt-profile.txt
          grep -q 'cache_apply_s=' /tmp/ldlt-profile.txt
          grep -q 'panel_build_s=' /tmp/ldlt-profile.txt
          grep -q 'pivot_bookkeeping_s=' /tmp/ldlt-profile.txt
          grep -q 'contribution_s=' /tmp/ldlt-profile.txt
          grep -q 'unattributed_front_s=' /tmp/ldlt-profile.txt
          grep -q 'factor_pack_s=' /tmp/ldlt-profile.txt
          grep -q 'front_prepare_s=' /tmp/ldlt-profile.txt
          grep -q 'original_assemble_s=' /tmp/ldlt-profile.txt
          grep -q 'extend_add_s=' /tmp/ldlt-profile.txt
          grep -q 'contribution_copy_s=' /tmp/ldlt-profile.txt
          grep -q 'contribution_move_s=' /tmp/ldlt-profile.txt
          grep -q 'contribution_copy_entries=' /tmp/ldlt-profile.txt
          grep -q 'contribution_moved_fronts=' /tmp/ldlt-profile.txt
          grep -q 'front_row_union_s=' /tmp/ldlt-profile.txt
          grep -q 'front_zero_s=' /tmp/ldlt-profile.txt
          grep -q 'front_position_map_s=' /tmp/ldlt-profile.txt
          grep -q 'front_contained_sources=' /tmp/ldlt-profile.txt
          grep -q 'front_merged_sources=' /tmp/ldlt-profile.txt
          grep -q 'simd_cache_apply_quads=' /tmp/ldlt-profile.txt
          grep -q 'segmented_extend_add_sources=' /tmp/ldlt-profile.txt
          grep -q 'segmented_extend_add_rows=' /tmp/ldlt-profile.txt
      - name: Compile and run OpenMP regressions
        run: |
          make -j2 WITH_OPENMP=1 check CXXFLAGS="-O3 -march=native -DNDEBUG -std=c++20 -Wall -Wextra -Wpedantic -fopenmp"
