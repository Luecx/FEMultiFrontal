name: Blocked LDLT
on:
  push:
    branches: [main, perf/ldlt-blocked-multifrontal, perf/metis-ordering-benchmark]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run regression tests (single threaded)
        run: |
          make -j2 all check CXXFLAGS="-O3 -march=native -DNDEBUG -std=c++20 -Wall -Wextra -Wpedantic"
      - name: Test scalar and blocked solver entry points
        run: |
          ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 1
          ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 32
      - name: Install optional METIS dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libmetis-dev
      - name: Validate METIS ordering for SPD and indefinite systems
        run: |
          make -j2 WITH_METIS=1 all check CXXFLAGS="-O3 -march=native -DNDEBUG -std=c++20 -Wall -Wextra -Wpedantic"
          ./build/native-metis/mfsolve tests/symmetric.mtx --ordering metis --analyze-only
          ./build/native-metis/mfsolve tests/symmetric.mtx --ordering metis --repeat 2
          ./build/native-metis/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering metis --ldlt-block-size 16 --repeat 2
          ./build/native-metis/mfsolve tests/asymmetric.mtx --matrix-type general --ordering metis
      - name: Verify optional dependency is not required in default build
        run: |
          if ./build/native/mfsolve tests/symmetric.mtx --ordering metis --analyze-only; then
            echo "Default build unexpectedly permits METIS" >&2
            exit 1
          fi
      - name: Compile and run OpenMP regressions
        run: |
          make -j2 WITH_OPENMP=1 check CXXFLAGS="-O3 -march=native -DNDEBUG -std=c++20 -Wall -Wextra -Wpedantic -fopenmp"
