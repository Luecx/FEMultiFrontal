name: Blocked LDLT
on:
  push:
    branches: [main, perf/ldlt-blocked-multifrontal, perf/ldlt-incremental-pivot-cache, perf/ldlt-eager-pivot-rows]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run regression tests (single threaded)
        run: |
          make -j2 all check CXXFLAGS="-O3 -march=native -DNDEBUG -std=c++20 -Wall -Wextra -Wpedantic"
      - name: Test cached pivots with multiple panel widths
        run: |
          for B in 8 16 32 64 128 256; do
            echo "Testing LDLT block size $B"
            MF_TEST_LDLT_BLOCK_SIZE="$B" ./build/native/tests/robustness > "/tmp/robustness-$B.log"
            tail -2 "/tmp/robustness-$B.log"
          done
      - name: Test scalar and blocked solver entry points
        run: |
          ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 1
          ./build/native/mfsolve tests/symmetric.mtx --matrix-type symmetric --ordering natural --threads 1 --ldlt-block-size 32
      - name: Compile and run OpenMP regressions
        run: |
          make -j2 WITH_OPENMP=1 check CXXFLAGS="-O3 -march=native -DNDEBUG -std=c++20 -Wall -Wextra -Wpedantic -fopenmp"
